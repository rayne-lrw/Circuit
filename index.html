<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盤面配線模擬器</title>
<meta name="description" content="在瀏覽器裡擺放電控器具、點接點拉線，依線槽自動走線的 2D 等比例盤面配線模擬器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23334'/%3E%3Cpath d='M3 4h5v8h5' fill='none' stroke='%23fc3' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261106.112413">
</head>
<body>
<div id="app">
  <header>
    <h1>盤面配線模擬器</h1>
    <div class="seg" role="group" aria-label="操作模式">
      <button id="mWire" aria-pressed="true" title="快捷鍵 W">接線</button>
      <button id="mPlace" aria-pressed="false" title="快捷鍵 M">擺放</button>
      <button id="mView" aria-pressed="false" title="快捷鍵 V：只能看、不能修改">檢視</button>
    </div>
    <div class="group">
      <button class="tool" id="undo" title="Ctrl+Z">復原</button>
      <button class="tool" id="redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="group">
      <button class="tool" id="bundle" aria-pressed="false" title="線槽內的線收成一束，選取時再看單條">線束模式</button>
      <button class="tool" id="labels" aria-pressed="false">顯示線號</button>
    </div>
    <div class="group">
      <button class="tool" id="zo" aria-label="縮小">−</button>
      <button class="tool" id="zi" aria-label="放大">+</button>
      <button class="tool" id="fit">全部</button>
      <button class="tool" id="vPlate">底板</button>
      <button class="tool" id="vDoor">面板</button>
      <button class="tool" id="vField">現場</button>
    </div>
    <span class="spacer"></span>
    <span id="stats"></span>
    <div class="group">
      <div class="menuwrap"><button class="tool" id="fileB" aria-haspopup="menu" aria-expanded="false">檔案…</button>
        <div id="fileM" class="menu" role="menu" hidden>
          <button class="mi" role="menuitem" id="exportB"><span>匯出專案</span><small>存成 JSON 檔</small></button>
          <button class="mi" role="menuitem" id="importB"><span>匯入專案</span><small>讀回 JSON 專案檔，可按復原</small></button>
          <button class="mi" role="menuitem" id="printB"><span>列印／PDF</span><small>圖面與各表格；在列印視窗選「另存為 PDF」</small></button>
          <button class="mi" role="menuitem" id="sample"><span>載入範例</span><small>換成範例電控箱，可按復原</small></button>
        </div></div>
      <input type="file" id="importF" accept=".json,application/json" hidden>
      <div class="menuwrap"><button class="tool" id="clearB" aria-haspopup="menu" aria-expanded="false">清除…</button><div id="clearM" class="menu" role="menu" hidden></div></div>
      <button class="tool" id="oldDraft" hidden>讀回舊版暫存</button>
    </div>
  </header>
  <main>
    <aside id="left">
      <div class="strip" aria-label="左欄已收合">
        <button class="tool" id="leftOpen" title="展開左欄" aria-label="展開左欄">»</button>
        <button class="tool vt" id="leftLib" title="展開器具庫">器具庫</button>
        <button class="tool vt" id="leftSet" title="盤面設定">盤面設定</button>
        <span class="vver" id="ver2"></span>
      </div>
      <button class="tool totop" id="toTop" hidden aria-label="回到器具庫最上方">↑ 最上</button>
      <div class="scroll">
        <div id="sizes">
          <div class="row" style="flex-wrap:nowrap;justify-content:stretch"><button class="tool setbtn" id="setOpen" aria-haspopup="dialog">盤面設定…</button><button class="tool" id="leftClose" title="收合左欄（接線時用不到器具庫）" aria-label="收合左欄">«</button></div>
          <p class="note" id="setSum"></p>
        </div>
        <div>
          <h2 class="h2ver"><span>器具庫 <button class="hq" data-help="lib" aria-expanded="false" aria-label="說明">?</button></span><span id="ver" title="目前版本；更新後這個號碼會改變">v20261106.112413</span></h2>
          <p class="note hn" data-helpfor="lib" hidden>滑鼠停在器具上可看尺寸來源。接點只對到實物的區塊與順序，選取器具後可按「編輯器具」修正。</p>
          <input id="libQ" type="search" placeholder="搜尋型號、品名、廠牌" aria-label="搜尋器具">
          <div class="row" style="margin-top:6px;justify-content:flex-start"><button class="tool" id="newTpl">新增自訂器具</button></div>
        </div>
        <div id="palette" style="display:flex;flex-direction:column;gap:14px"></div>
      </div>
    </aside>
    <div id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="電控箱配線展開圖">
        <g id="world">
          <g id="board"></g>
          <g id="wires"></g>
          <g id="top"></g>
          <g id="ov"></g>
        </g>
      </svg>
      <div id="help"><div id="helpP" hidden role="status"><p id="hintT"></p><div class="row" style="justify-content:space-between;align-items:center"><button class="lnk" id="helpReset">重設提示紀錄</button><button class="tool" id="helpClose">收合</button></div></div><button class="tool" id="helpB" aria-expanded="false" aria-controls="helpP">? 說明</button></div>
      <div id="viewTag" hidden>檢視中，不能修改</div>
      <div id="tip" hidden></div>
      <div id="pop" hidden role="dialog" aria-label="選擇線徑與顏色"></div>
      <div id="toast" hidden role="status"></div>
      <div id="io" hidden role="dialog" aria-label="匯出內容">
        <p class="note">這個檢視無法直接存檔。請複製下面的內容，貼到文字檔後存成檔案。</p>
        <textarea id="ioText" readonly aria-label="匯出內容"></textarea>
        <div class="row"><button class="tool" id="ioClose">關閉</button><button class="primary" id="ioCopy">複製</button></div>
      </div>
    </div>
    <aside id="right">
      <div id="detail" hidden></div>
      <div class="scroll">
        <div>
          <h2 id="issuesH">檢查</h2>
          <div class="issues" id="issues"></div>
        </div>
        <div id="filters">
          <h2>篩選</h2>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div class="chips" id="fKind"></div>
            <div class="chips" id="fColor"></div>
            <div class="chips" id="fGauge"></div>
            <select id="fDev" aria-label="依器具篩選"></select>
          </div>
        </div>
        <div>
          <div class="seg" role="group" aria-label="清單" style="margin-bottom:6px">
            <button id="tabAll" aria-pressed="true">線號表</button>
            <button id="tabExt" aria-pressed="false">電纜</button>
            <button id="tabBom" aria-pressed="false">材料表</button>
            <button id="tabLen" aria-pressed="false">線長</button>
          </div>
          <div class="row" id="listTools" style="justify-content:flex-start;margin-bottom:6px"><button class="tool" id="listCsv">匯出線號表 CSV</button></div>
          <h2 id="listH">線號表</h2>
          <div id="list"></div>
        </div>
      </div>
    </aside>
  </main>
</div>
<div id="setDlg" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <h2 id="setTitle">盤面設定 (mm) <button class="hq" data-help="set" aria-expanded="false" aria-label="說明">?</button></h2>
    <p class="note hn" data-helpfor="set" hidden>改箱體或底板尺寸時，面板與現場區裡的東西會一起平移。</p>
    <div class="fields">
            <label for="bw">箱寬<input id="bw" type="number" step="10" min="100"></label>
            <label for="bh">箱高<input id="bh" type="number" step="10" min="100"></label>
            <label for="bd">箱深<input id="bd" type="number" step="10" min="50"></label>
            <label for="bk">底板到箱背<input id="bk" type="number" step="5" min="0"></label>
            <label for="pw">底板寬<input id="pw" type="number" step="10" min="100"></label>
            <label for="ph">底板高<input id="ph" type="number" step="10" min="100"></label>
            <label for="dm" style="grid-column:1/-1">面板<select id="dm"><option value="door">門板（蓋住箱體，檢查關門碰撞）</option><option value="console">獨立操作台（不檢查尺寸）</option><option value="none">不使用</option></select></label>
            <label for="dw">面板寬<input id="dw" type="number" step="10" min="100"></label>
            <label for="dh">面板高<input id="dh" type="number" step="10" min="100"></label>
            <label for="hy">過門線束 Y<input id="hy" type="number" step="10"></label>
            <label for="fl">線槽上限 %<input id="fl" type="number" step="5" min="5" max="100"></label>
            <label class="check" style="grid-column:1/-1"><input type="checkbox" id="warnMixed">同一電位有不同線號時提示</label>
          </div>
    <div class="row"><button class="primary" id="setClose">完成</button></div>
  </div>
</div>
<div id="print" aria-hidden="true"></div>
<div id="ed" hidden role="dialog" aria-label="器具編輯器">
  <div id="edCard">
    <h2><span id="edTitle">器具編輯器</span> <button class="hq" data-help="ed" aria-expanded="false" aria-label="說明">?</button></h2>
    <p class="note hn wide" data-helpfor="ed" hidden>接點文字改動後會重新平均排列。排好後可在右圖拖曳接點到實際位置。</p>
    <p id="edSlotNote" class="note wide" hidden><b>WAGO 端子台的端子號不用在這裡改。</b>請關掉這個視窗，在右側面板的「端子號」每片一格填寫。在這裡儲存會把它變成自訂器具，之後就不能每片填端子號，也不能直接改片數。</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="fields">
        <label for="eName">名稱／型號<input id="eName" maxlength="40"></label>
        <label for="eBrand">廠牌<input id="eBrand" maxlength="20"></label>
        <label for="eSheet">安裝位置<select id="eSheet"><option value="plate">底板</option><option value="door">面板</option><option value="field">現場</option></select></label>
        <label for="ePre">編號字首<input id="ePre" maxlength="6"></label>
        <label for="eW">寬 mm<input id="eW" type="number" min="5" step="1"></label>
        <label for="eH">高 mm<input id="eH" type="number" min="5" step="1"></label>
        <label for="eD">深 mm<input id="eD" type="number" min="0" step="1"></label>
        <label for="eCol">外殼顏色<input id="eCol" type="color"></label>
      </div>
      <div class="fields" style="grid-template-columns:1fr">
        <label for="eTop">上排接點（逗號分隔）<input id="eTop"></label>
        <label for="eBot">下排接點（逗號分隔）<input id="eBot"></label>
      </div>
      <label class="check"><input type="checkbox" id="eOk">尺寸與接點已對照型錄或實物</label>
    </div>
    <div><svg id="edPrev" aria-label="器具預覽"></svg></div>
    <div class="row wide"><button class="tool" id="edCancel">取消</button><button class="primary" id="edSave">儲存器具</button></div>
  </div>
</div>

<script src="js/inventory.js?v=20261106.112413"></script>
<script src="js/devices.js?v=20261106.112413"></script>
<script src="js/cable.js?v=20261106.112413"></script>
<script src="js/sample.js?v=20261106.112413"></script>
<script src="js/state.js?v=20261106.112413"></script>
<script src="js/routing.js?v=20261106.112413"></script>
<script src="js/render.js?v=20261106.112413"></script>
<script src="js/panels.js?v=20261106.112413"></script>
<script src="js/popup.js?v=20261106.112413"></script>
<script src="js/report.js?v=20261106.112413"></script>
<script src="js/interact.js?v=20261106.112413"></script>
<script src="js/cables-ui.js?v=20261106.112413"></script>
<script src="js/multi.js?v=20261106.112413"></script>
<script src="js/editor.js?v=20261106.112413"></script>
<script src="js/main.js?v=20261106.112413"></script>
</body>
</html>
